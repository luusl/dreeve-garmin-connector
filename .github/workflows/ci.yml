name: ci
on:
  workflow_dispatch:
  pull_request:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: Run CI (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Validate the lockfile is up to date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff
        run: uv run ruff check --output-format=github

      - name: Run Ruff format dry-run
        run: uv run ruff format --check

      - name: Run mypy
        run: uv run mypy

      - name: Run test suite
        run: uv run pytest --cov --cov-report=term-missing
